openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Palestine Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: accounts
    description: Social media accounts
  - name: admin
    description: Admin operations
  - name: auth
    description: Authentication
  - name: settings
    description: Site settings
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: reviews
    description: Customer review images
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all available accounts
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [tiktok, instagram, facebook, tiktok_monetized]
        - name: status
          in: query
          schema:
            type: string
            enum: [available, sold]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/featured:
    get:
      operationId: listFeaturedAccounts
      tags: [accounts]
      summary: Get featured accounts for homepage
      responses:
        "200":
          description: Featured accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/recent:
    get:
      operationId: listRecentAccounts
      tags: [accounts]
      summary: Get most recently added accounts
      responses:
        "200":
          description: Recent accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a single account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Not found

  /accounts/{id}/click:
    post:
      operationId: trackAccountClick
      tags: [accounts]
      summary: Track WhatsApp button click on an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Click tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResult"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin info
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfo"
        "401":
          description: Unauthorized

  /admin/accounts:
    get:
      operationId: adminListAccounts
      tags: [admin]
      summary: List all accounts (admin, includes sold)
      parameters:
        - name: platform
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [admin]
      summary: Create a new account listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /admin/accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [admin]
      summary: Update an account listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      operationId: deleteAccount
      tags: [admin]
      summary: Delete an account listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"


  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /admin/settings:
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/whatsapp-click:
    post:
      operationId: trackWhatsappClick
      tags: [stats]
      summary: Track a WhatsApp button click (floating button)
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResult"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List customer review images
      responses:
        "200":
          description: List of review images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewImage"

  /admin/reviews:
    post:
      operationId: createReview
      tags: [admin]
      summary: Add a review image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewImageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewImage"

  /admin/reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [admin]
      summary: Delete a review image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Account:
      type: object
      required: [id, name, platform, followers, price, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized]
        followers:
          type: integer
        price:
          type: number
        description:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        accountUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        clickCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        earningsStatus:
          type: ["string", "null"]
        eligibleCountry:
          type: ["string", "null"]
        activationDate:
          type: ["string", "null"]
        earningsNotes:
          type: ["string", "null"]
        avgEarningsPer10k:
          type: ["number", "null"]

    AccountInput:
      type: object
      required: [name, platform, followers, price]
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized]
        followers:
          type: integer
        price:
          type: number
        description:
          type: string
        username:
          type: string
        imageUrl:
          type: string
        accountUrl:
          type: string
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        earningsStatus:
          type: string
        eligibleCountry:
          type: string
        activationDate:
          type: string
        earningsNotes:
          type: string
        avgEarningsPer10k:
          type: number

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized]
        followers:
          type: integer
        price:
          type: number
        description:
          type: string
        username:
          type: string
        imageUrl:
          type: string
        accountUrl:
          type: string
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        earningsStatus:
          type: string
        eligibleCountry:
          type: string
        activationDate:
          type: string
        earningsNotes:
          type: string
        avgEarningsPer10k:
          type: number

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AdminInfo:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SiteSettings:
      type: object
      required: [storeName, whatsapp, email]
      properties:
        storeName:
          type: string
        storeNameAr:
          type: string
        logoUrl:
          type: ["string", "null"]
        whatsapp:
          type: string
        telegram:
          type: ["string", "null"]
        email:
          type: string
        bannerTitle:
          type: ["string", "null"]
        bannerSubtitle:
          type: ["string", "null"]
        paymentMethods:
          type: array
          items:
            type: string
        paymentNote:
          type: ["string", "null"]

    SiteSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
        storeNameAr:
          type: string
        logoUrl:
          type: string
        whatsapp:
          type: string
        telegram:
          type: string
        email:
          type: string
        bannerTitle:
          type: string
        bannerSubtitle:
          type: string
        paymentMethods:
          type: array
          items:
            type: string
        paymentNote:
          type: string

    ReviewImage:
      type: object
      required: [id, imageUrl, createdAt]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        caption:
          type: ["string", "null"]
        createdAt:
          type: string

    ReviewImageInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
        caption:
          type: string

    DashboardStats:
      type: object
      required: [totalAccounts, soldAccounts, availableAccounts, totalClicks, whatsappClicks, topAccounts, monetizedAccounts, tiktokAccounts, instagramAccounts, facebookAccounts]
      properties:
        totalAccounts:
          type: integer
        soldAccounts:
          type: integer
        availableAccounts:
          type: integer
        monetizedAccounts:
          type: integer
        tiktokAccounts:
          type: integer
        instagramAccounts:
          type: integer
        facebookAccounts:
          type: integer
        totalClicks:
          type: integer
        whatsappClicks:
          type: integer
        topAccounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ImageUploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ClickResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
