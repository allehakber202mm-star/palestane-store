openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Palestine Store API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: accounts
    description: Social media accounts
  - name: admin
    description: Admin operations
  - name: auth
    description: Authentication
  - name: settings
    description: Site settings
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: reviews
    description: Customer review images
  - name: feedback
    description: Telegram channel feedback posts
  - name: celebrity-ads
    description: Celebrity endorsement ad videos
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List all available accounts
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [tiktok, instagram, facebook, tiktok_monetized, snapchat]
        - name: status
          in: query
          schema:
            type: string
            enum: [available, sold]
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum: [followers_desc, followers_asc, newest, oldest, price_desc, price_asc]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/featured:
    get:
      operationId: listFeaturedAccounts
      tags: [accounts]
      summary: Get featured accounts for homepage
      responses:
        "200":
          description: Featured accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/recent:
    get:
      operationId: listRecentAccounts
      tags: [accounts]
      summary: Get most recently added accounts
      responses:
        "200":
          description: Recent accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a single account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Not found

  /accounts/{id}/visit:
    post:
      operationId: trackAccountVisit
      tags: [accounts]
      summary: Track a visit to an account URL (with 30-min rate limiting per visitor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Visit tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitResult"

  /accounts/{id}/click:
    post:
      operationId: trackAccountClick
      tags: [accounts]
      summary: Track WhatsApp button click on an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Click tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResult"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin info
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfo"
        "401":
          description: Unauthorized

  /admin/accounts:
    get:
      operationId: adminListAccounts
      tags: [admin]
      summary: List all accounts (admin, includes sold)
      parameters:
        - name: platform
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [admin]
      summary: Create a new account listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /admin/accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [admin]
      summary: Update an account listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      operationId: deleteAccount
      tags: [admin]
      summary: Delete an account listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"


  /admin/facebook/sync:
    post:
      operationId: facebookSync
      tags: [admin]
      summary: Scrape and sync Facebook follower counts for all Facebook accounts
      responses:
        "200":
          description: Sync report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookSyncReport"

  /stats/site-visit:
    post:
      operationId: trackSiteVisit
      tags: [stats]
      summary: Record a site page visit (with bot filtering and dedup)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteVisitInput"
      responses:
        "200":
          description: Visit recorded or skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteVisitResult"

  /stats/site-overview:
    get:
      operationId: getSiteOverview
      tags: [stats]
      summary: Get comprehensive site visit analytics (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Site visit overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteOverview"

  /admin/visits/stats:
    get:
      operationId: getVisitStats
      tags: [admin]
      summary: Get visit statistics for all accounts
      responses:
        "200":
          description: Visit statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /admin/settings:
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/whatsapp-click:
    post:
      operationId: trackWhatsappClick
      tags: [stats]
      summary: Track a WhatsApp button click (floating button)
      responses:
        "200":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResult"

  /celebrity-ads:
    get:
      operationId: listCelebrityAds
      tags: [celebrity-ads]
      summary: List celebrity ad videos
      responses:
        "200":
          description: List of celebrity ad videos ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CelebrityAd"

  /admin/celebrity-ads:
    post:
      operationId: createCelebrityAd
      tags: [admin]
      summary: Create a celebrity ad video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CelebrityAdInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CelebrityAd"

  /admin/celebrity-ads/{id}:
    patch:
      operationId: updateCelebrityAd
      tags: [admin]
      summary: Update a celebrity ad video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CelebrityAdUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CelebrityAd"
    delete:
      operationId: deleteCelebrityAd
      tags: [admin]
      summary: Delete a celebrity ad video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List feedback posts from Telegram channel
      responses:
        "200":
          description: List of feedback posts ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackPost"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List customer review images
      responses:
        "200":
          description: List of review images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewImage"

  /admin/reviews:
    post:
      operationId: createReview
      tags: [admin]
      summary: Add a review image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewImageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewImage"

  /admin/reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [admin]
      summary: Delete a review image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Account:
      type: object
      required: [id, name, platform, followers, price, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized, snapchat]
        followers:
          type: integer
        price:
          type: number
        description:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        accountUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        clickCount:
          type: integer
        visitCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        earningsStatus:
          type: ["string", "null"]
        eligibleCountry:
          type: ["string", "null"]
        activationDate:
          type: ["string", "null"]
        earningsNotes:
          type: ["string", "null"]
        avgEarningsPer10k:
          type: ["number", "null"]
        followersUpdatedAt:
          type: ["string", "null"]
          format: date-time
        additionalImages:
          type: array
          items:
            type: string
          nullable: true

    FacebookSyncResultItem:
      type: object
      required: [accountId, accountName, status, oldCount]
      properties:
        accountId:
          type: integer
        accountName:
          type: string
        status:
          type: string
          enum: [updated, unchanged, failed]
        oldCount:
          type: integer
        newCount:
          type: integer
          nullable: true
        resolvedUrl:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true

    FacebookSyncReport:
      type: object
      required: [total, updated, unchanged, failed, results]
      properties:
        total:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/FacebookSyncResultItem"

    AccountInput:
      type: object
      required: [name, platform, followers, price]
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized, snapchat]
        followers:
          type: integer
        price:
          type: number
        description:
          type: string
        username:
          type: string
        imageUrl:
          type: string
        accountUrl:
          type: string
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        earningsStatus:
          type: string
        eligibleCountry:
          type: string
        activationDate:
          type: string
        earningsNotes:
          type: string
        avgEarningsPer10k:
          type: number

    AccountUpdate:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, facebook, tiktok_monetized, snapchat]
        followers:
          type: integer
        price:
          type: number
        description:
          type: string
        username:
          type: string
        imageUrl:
          type: string
        accountUrl:
          type: string
        status:
          type: string
          enum: [available, sold]
        featured:
          type: boolean
        earningsStatus:
          type: string
        eligibleCountry:
          type: string
        activationDate:
          type: string
        earningsNotes:
          type: string
        avgEarningsPer10k:
          type: number

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AdminInfo:
      type: object
      required: [email]
      properties:
        email:
          type: string

    SiteSettings:
      type: object
      required: [storeName, whatsapp, email]
      properties:
        storeName:
          type: string
        storeNameAr:
          type: string
        logoUrl:
          type: ["string", "null"]
        whatsapp:
          type: string
        telegram:
          type: ["string", "null"]
        email:
          type: string
        bannerTitle:
          type: ["string", "null"]
        bannerSubtitle:
          type: ["string", "null"]
        paymentMethods:
          type: array
          items:
            type: string
        paymentNote:
          type: ["string", "null"]

    SiteSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
        storeNameAr:
          type: string
        logoUrl:
          type: string
        whatsapp:
          type: string
        telegram:
          type: string
        email:
          type: string
        bannerTitle:
          type: string
        bannerSubtitle:
          type: string
        paymentMethods:
          type: array
          items:
            type: string
        paymentNote:
          type: string

    ReviewImage:
      type: object
      required: [id, imageUrl, createdAt]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        caption:
          type: ["string", "null"]
        createdAt:
          type: string

    ReviewImageInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
        caption:
          type: string

    DashboardStats:
      type: object
      required: [totalAccounts, soldAccounts, availableAccounts, totalClicks, whatsappClicks, topAccounts, monetizedAccounts, tiktokAccounts, instagramAccounts, facebookAccounts, snapchatAccounts]
      properties:
        totalAccounts:
          type: integer
        soldAccounts:
          type: integer
        availableAccounts:
          type: integer
        monetizedAccounts:
          type: integer
        tiktokAccounts:
          type: integer
        instagramAccounts:
          type: integer
        facebookAccounts:
          type: integer
        snapchatAccounts:
          type: integer
        totalClicks:
          type: integer
        whatsappClicks:
          type: integer
        feedbackPosts:
          type: integer
        recentAccounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        topAccounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ImageUploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    ClickResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    VisitInput:
      type: object
      required: [visitorId]
      properties:
        visitorId:
          type: string

    VisitResult:
      type: object
      required: [counted, visitCount]
      properties:
        counted:
          type: boolean
        visitCount:
          type: integer
        accountUrl:
          type: ["string", "null"]

    VisitStatRow:
      type: object
      required: [accountId, accountTitle, visitCount]
      properties:
        accountId:
          type: integer
        accountTitle:
          type: string
        platform:
          type: string
        imageUrl:
          type: ["string", "null"]
        visitCount:
          type: integer
        lastVisit:
          type: ["string", "null"]

    VisitStats:
      type: object
      required: [totalVisits, topAccounts]
      properties:
        totalVisits:
          type: integer
        topAccounts:
          type: array
          items:
            $ref: "#/components/schemas/VisitStatRow"

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    CelebrityAd:
      type: object
      required: [id, title, videoUrl, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CelebrityAdInput:
      type: object
      required: [title, videoUrl]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        videoUrl:
          type: string
          minLength: 1
        thumbnailUrl:
          type: string
          nullable: true

    CelebrityAdUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        videoUrl:
          type: string
          minLength: 1
        thumbnailUrl:
          type: string
          nullable: true

    FeedbackPost:
      type: object
      required: [id, telegramMessageId, postedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        telegramMessageId:
          type: integer
        text:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        postedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteVisitInput:
      type: object
      required: [visitorId, sessionId, page]
      properties:
        visitorId:
          type: string
        sessionId:
          type: string
        page:
          type: string

    SiteVisitResult:
      type: object
      required: [counted]
      properties:
        counted:
          type: boolean
        reason:
          type: string
          nullable: true

    SiteOverviewDayEntry:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer

    SiteOverviewPageEntry:
      type: object
      required: [page, count]
      properties:
        page:
          type: string
        count:
          type: integer

    SiteOverview:
      type: object
      required: [total, today, last7days, last30days, uniqueVisitors, activeNow, dailyChart, topPages]
      properties:
        total:
          type: integer
        today:
          type: integer
        last7days:
          type: integer
        last30days:
          type: integer
        uniqueVisitors:
          type: integer
        activeNow:
          type: integer
        dailyChart:
          type: array
          items:
            $ref: "#/components/schemas/SiteOverviewDayEntry"
        topPages:
          type: array
          items:
            $ref: "#/components/schemas/SiteOverviewPageEntry"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
